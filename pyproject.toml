[project]
name = "agent-knowledgebase"
version = "0.13.1"
description = "Personal knowledgebase plugin — ingest sources, build wiki artifacts, query with vector search"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "chromadb>=0.5",
    "trafilatura>=1.0",
    "gitpython>=3.1",
    "httpx>=0.27",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# v0.13.0 — three embedder providers, all installable in the Docker
# image. The Dockerfile installs requirements.lock which already
# includes the embed-local-st extra so sentence-transformers ships
# in the image. No pinecone, no fastembed.
embed-local-st = ["sentence-transformers>=3.0"]
ingest-file = ["pdfplumber>=0.11"]
ingest-sql = [
    "sqlalchemy>=2.0",
    "sqlparse>=0.5",
]
all = [
    "sentence-transformers>=3.0",
    "pdfplumber>=0.11",
    "sqlalchemy>=2.0",
    "sqlparse>=0.5",
]

[project.scripts]
agent-knowledgebase-server = "agent_knowledgebase.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_knowledgebase"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
