[project]
name = "agent-knowledgebase"
version = "0.11.0"
description = "Personal knowledgebase plugin — ingest sources, build wiki artifacts, query with vector search"
requires-python = ">=3.11"
# Phase 5 default install — minimal viable retrieval. chromadb stays
# (default vectorstore); httpx + pydantic + mcp + tiktoken + trafilatura
# are runtime essentials. sentence-transformers, tree-sitter*,
# pdfplumber, sqlalchemy, sqlparse have moved into [optional-dependencies]
# extras to drop the default install size. spec_id:
# 70ab2170-381a-4657-bcd1-28a40c6f369b
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "chromadb>=0.5",
    "trafilatura>=1.0",
    "gitpython>=3.1",
    "httpx>=0.27",
    "tiktoken>=0.7",
]

# Phase 5 — opt-in extras. See docs/install_size.md for per-extra
# install-size tables. The 'all' convenience extra pulls every
# optional dep group at once. spec_id:
# 70ab2170-381a-4657-bcd1-28a40c6f369b
[project.optional-dependencies]
embed-local-onnx = ["qdrant-fastembed>=0.4"]
embed-local-st = ["sentence-transformers>=3.0"]
# I-03: codebase ingestion uses regex-based symbol detection — there is
# no tree-sitter import anywhere in src/. The extra is retained as an
# empty placeholder so callers depending on the name don't break, and so
# a future tree-sitter-backed chunker can land here without renaming the
# extra group.
# spec_id: 70ab2170-381a-4657-bcd1-28a40c6f369b
ingest-codebase = []  # placeholder; future tree-sitter chunking will land here
ingest-file = ["pdfplumber>=0.11"]
ingest-sql = [
    "sqlalchemy>=2.0",
    "sqlparse>=0.5",
]
pinecone = ["pinecone-client>=3.0"]
all = [
    "qdrant-fastembed>=0.4",
    "sentence-transformers>=3.0",
    "pdfplumber>=0.11",
    "sqlalchemy>=2.0",
    "sqlparse>=0.5",
    "pinecone-client>=3.0",
]

[project.scripts]
agent-knowledgebase-server = "agent_knowledgebase.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_knowledgebase"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
