[project]
name = "agent-knowledgebase"
version = "0.2.0"
description = "Personal knowledgebase plugin — ingest sources, build wiki artifacts, query with vector search"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "trafilatura>=1.0",
    "tree-sitter>=0.23",
    "tree-sitter-languages>=1.10",
    "gitpython>=3.1",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
pinecone = ["pinecone-client>=3.0"]
openai = ["openai>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_knowledgebase"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
